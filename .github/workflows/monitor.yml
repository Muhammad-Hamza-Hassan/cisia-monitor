name: CISIA 24/7 Slot Checker

on:
  schedule:
    - cron: '*/10 * * * *'   # Runs automatically every 10 minutes 24/7
  workflow_dispatch:         # Lets you click "Run workflow" manually to test

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install requests beautifulsoup4

      - name: Run CISIA check
        run: python check.py

      - name: Save state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_slots.json || true
          git diff --staged --quiet || (git commit -m "Update seen slots" && git push)
